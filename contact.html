<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire de contact</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>
<body>

<div class="container mt-5 mb-5">
      <div class="cv-card shadow">
  
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="text-center mb-4">Formulaire de contact</h2>

            <form>
                <!-- Nom -->
                <div class="mb-3">
                    <label class="form-label">Nom</label>
                    <input type="text" class="form-control" placeholder="Rakrouki">
                </div>

                <!-- Prénom -->
                <div class="mb-3">
                    <label class="form-label">Hana</label>
                    <input type="text" class="form-control" placeholder="Votre prénom">
                </div>
                <!-- Liste déroulante -->
                <div class="mb-3">
                    <label class="form-label">Gouvernent</label>
                    <select class="form-select">
                    
                        <option value="1">Tozeur</option>
                        <option value="2">Gafsa</option>
                        <option value="3">Tunis</option>
                    </select>
                </div>

                <div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Email address</label>
  <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
</div>
<div class="mb-3">
  <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
  <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
</div>

                <!-- Boutons -->
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">
                        Envoyer
                    </button>

                    <a href="index.html" class="btn btn-secondary">
                        Retour au CV
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
